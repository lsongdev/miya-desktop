name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Generate version tag
        id: version
        run: |
          raw="$(TZ=Asia/Shanghai date '+%y.%m.%d')"
          IFS=. read -r yy mm dd <<< "$raw"
          version="$((10#$yy)).$((10#$mm)).$((10#$dd))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install and test
        run: |
          make install
          go test ./...
          go vet ./...
      - name: Build
        run: |
          make build-macos APP_VERSION=${{ needs.prepare.outputs.version }}
          make build-macos-arm64 APP_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package
        run: |
          mkdir -p build/artifacts
          ditto -c -k --keepParent "bin/darwin-universal/Miya Desktop.app" "build/artifacts/miya-desktop-${{ needs.prepare.outputs.version }}-darwin-universal.zip"
          ditto -c -k --keepParent "bin/darwin-arm64/Miya Desktop.app" "build/artifacts/miya-desktop-${{ needs.prepare.outputs.version }}-darwin-arm64.zip"
          find bin -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name 'update-*.json' -o -name '*.delta' \) -exec cp {} build/artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.prepare.outputs.version }}
          path: build/artifacts/*

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install and test
        shell: bash
        run: |
          make install
          go test ./...
      - name: Build
        shell: bash
        run: make build-windows APP_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/artifacts | Out-Null
          if (!(Test-Path "bin/windows-amd64/miya-desktop-setup-*.exe")) { throw "MyGo Windows installer was not generated" }
          Compress-Archive -Path "bin/windows-amd64/Miya Desktop.exe" -DestinationPath "build/artifacts/miya-desktop-${{ needs.prepare.outputs.version }}-windows-amd64.zip" -Force
          Get-ChildItem bin/windows-amd64 -File | Where-Object { $_.Name -like 'miya-desktop-setup-*' -or $_.Name -like '*.tar.gz' -or $_.Name -like 'update-*.json' -or $_.Name -like '*.delta' } | Copy-Item -Destination build/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.prepare.outputs.version }}
          path: build/artifacts/*

  release:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Miya Desktop ${{ needs.prepare.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          files: artifacts/*
