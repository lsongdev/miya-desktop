version: "3"

tasks:
  build:
    summary: Build the native Go desktop application.
    cmds:
      - go tool mygo build
  darwin:build:
    cmds:
      - go tool mygo build -platform darwin/universal
  windows:build:
    cmds:
      - go tool mygo build -platform windows/amd64
  linux:build:
    cmds:
      - go tool mygo build -platform linux/amd64
  dev:
    summary: Run the native application with Go hot reload.
    cmds:
      - go tool mygo dev
  run:
    cmds:
      - task: dev
  test:
    cmds:
      - go test ./...
      - go vet ./...
